<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="1682" viewBox="0 0 1188 1682" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif"><rect width="100%" height="100%" fill="#fbfaf7"/><rect x="60" y="56" width="1068" height="124" rx="16" fill="#e9e7e1" stroke="#1c1c1a" stroke-width="2.8"/><text x="594" y="114" text-anchor="middle" font-size="44" font-weight="800" fill="#1c1c1a">WaveSense</text><text x="594" y="142" text-anchor="middle" font-size="19" fill="#6f6b63">부제 한 줄: Wi-Fi 신호로 CCTV 사각지대의 사람을 찾는다 · 팀원</text><rect x="60" y="204" width="520" height="456" rx="16" fill="#fff4ef" stroke="#d9472b" stroke-width="5.2"/><text x="320" y="428" text-anchor="middle" font-size="34" font-weight="800" fill="#d9472b">CCTV가 보는 방</text><text x="320" y="456" text-anchor="middle" font-size="19" fill="#6f6b63">같은 방, 카메라 화면 · 장애물 뒤 구역 4는 비어 보임</text><rect x="608" y="204" width="520" height="456" rx="16" fill="#fff4ef" stroke="#d9472b" stroke-width="5.2"/><text x="868" y="428" text-anchor="middle" font-size="34" font-weight="800" fill="#d9472b">WaveSense가 보는 방</text><text x="868" y="456" text-anchor="middle" font-size="19" fill="#6f6b63">같은 순간, Wi-Fi 평면도 · 구역 4의 사람이 표시됨</text><rect x="60" y="684" width="1068" height="112" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="594" y="736" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">01  카메라가 못 보는 곳</text><text x="594" y="764" text-anchor="middle" font-size="19" fill="#6f6b63">가려진 곳 · 카메라를 둘 수 없는 곳 · 어두운 곳 (아이콘 3개)</text><rect x="60" y="820" width="428" height="360" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="274" y="996" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">02  감지 원리</text><text x="274" y="1024" text-anchor="middle" font-size="19" fill="#6f6b63">사람이 있으면 신호가 흔들린다 · CSI 파형 3개</text><rect x="512" y="820" width="616" height="360" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="820" y="996" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">03  설치와 구성</text><text x="820" y="1024" text-anchor="middle" font-size="19" fill="#6f6b63">평면 배치도 · 송신 1 · 수신 3 · 2×2 구역 · 노트북 1</text><rect x="60" y="1204" width="1068" height="88" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="594" y="1244" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">04  동작 흐름</text><text x="594" y="1272" text-anchor="middle" font-size="19" fill="#6f6b63">빈 방 보정 → 신호 수집 → 판정 → 평면도 표시</text><rect x="60" y="1316" width="592" height="196" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="356" y="1410" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">05  사전 검증</text><text x="356" y="1438" text-anchor="middle" font-size="19" fill="#6f6b63">보드를 사기 전에 공개 데이터로 확인 · 큰 수치 3~4개</text><rect x="676" y="1316" width="452" height="196" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="902" y="1410" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">06  이렇게 증명한다</text><text x="902" y="1438" text-anchor="middle" font-size="19" fill="#6f6b63">카메라 단독 vs Wi-Fi 단독 vs 둘 다</text><text x="902" y="1462" text-anchor="middle" font-size="19" fill="#6f6b63">사각지대 감지율 비교</text><rect x="60" y="1536" width="752" height="88" rx="16" fill="#ffffff" stroke="#1c1c1a" stroke-width="2.8"/><text x="436" y="1576" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">07  활용</text><text x="436" y="1604" text-anchor="middle" font-size="19" fill="#6f6b63">보안 · 돌봄 · 스마트홈</text><rect x="836" y="1536" width="292" height="88" rx="16" fill="#e9e7e1" stroke="#1c1c1a" stroke-width="2.8"/><text x="982" y="1590" text-anchor="middle" font-size="28" font-weight="800" fill="#1c1c1a">참고 자료</text><text x="594" y="440" text-anchor="middle" font-size="24" font-weight="800" fill="#d9472b">→</text><text x="594" y="196" text-anchor="middle" font-size="17" fill="#d9472b">핵심 장면 · 가장 크게</text></svg>
